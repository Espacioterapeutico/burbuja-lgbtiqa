<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rainbowRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Background disc -->
  <rect width="160" height="160" rx="80" fill="url(#bg)"/>
  <rect width="154" height="154" x="3" y="3" rx="77" fill="none" stroke="url(#rainbowRim)" stroke-width="3" stroke-dasharray="5 4" stroke-opacity="0.7"/>
  <!-- Silhouette head -->
  <circle cx="80" cy="56" r="28" fill="#94a3b8"/>
