  <path d="M110 113 h3 l1.5 -2.5 h7 l1.5 2.5 h3 c1.1 0 2 .9 2 2 v8 c0 1.1 -.9 2 -2 2 h-16 c-1.1 0 -2 -.9 -2 -2 v-8 c0 -1.1 .9 -2 2 -2 Z" fill="#ffffff"/>
