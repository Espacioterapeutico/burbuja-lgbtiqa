<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="soapRainbow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="soapRainbow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="bubbleGlass" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="85%" stop-color="#e879f9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25" />
    </radialGradient>
  </defs>

  <!-- Left Soap Bubble Sphere -->
  <circle
    cx="38"
    cy="48"
    r="28"
    fill="url(#bubbleGlass)"
    stroke="url(#soapRainbow1)"
    stroke-width="3.5"
  />
  <!-- Left Soap Bubble Specular Light Reflection -->
  <path
    d="M22 36 A 20 20 0 0 1 38 24"
    stroke="#ffffff"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-opacity="0.85"
  />
  <circle cx="25" cy="42" r="1.5" fill="#ffffff" fill-opacity="0.7" />

  <!-- Right Interlinking Soap Bubble Sphere -->
  <circle
    cx="62"
    cy="52"
    r="28"
    fill="url(#bubbleGlass)"
    stroke="url(#soapRainbow2)"
    stroke-width="3.5"
  />
  <!-- Right Soap Bubble Specular Light Reflection -->
  <path
    d="M48 40 A 20 20 0 0 1 64 28"
    stroke="#ffffff"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-opacity="0.85"
  />
  <circle cx="75" cy="65" r="1.5" fill="#ffffff" fill-opacity="0.6" />

  <!-- Intersection Shared Chain Link / Soap Film Boundary -->
  <ellipse
    cx="50"
    cy="50"
    rx="8"
    ry="22"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-opacity="0.5"
    stroke-dasharray="2 3"
  />

  <!-- Tiny Floating Micro Soap Bubbles -->
  <circle cx="76" cy="22" r="4" fill="url(#bubbleGlass)" stroke="url(#soapRainbow1)" stroke-width="1" />
  <circle cx="75" cy="21" r="1" fill="#fff" />
  <circle cx="20" cy="74" r="3" fill="url(#bubbleGlass)" stroke="url(#soapRainbow2)" stroke-width="0.8" />
</svg>